environment: prod

config:
  corsOrigin: http://helm-prod.tasktracker.local:8088
  backendUrl: http://helm-prod.tasktracker.local:8088

backend:
  replicaCount: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 250m, memory: 384Mi}

frontend:
  replicaCount: 2

ingress:
  host: helm-prod.tasktracker.local

quota:
  requestsCpu: "2"
  pods: "12"
