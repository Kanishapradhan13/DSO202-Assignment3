apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.fullname" . }}-frontend-svc
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "task-tracker.selector" (dict "ctx" . "tier" "frontend") | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-tracker.fullname" . }}-frontend
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "task-tracker.selector" (dict "ctx" . "tier" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-tracker.selector" (dict "ctx" . "tier" "frontend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-tracker.fullname" . }}-config
                  key: BACKEND_URL
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
