apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.fullname" . }}-backend-svc
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "task-tracker.selector" (dict "ctx" . "tier" "backend") | nindent 4 }}
  ports:
    - port: {{ .Values.config.appPort }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-tracker.fullname" . }}-backend
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "task-tracker.selector" (dict "ctx" . "tier" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-tracker.selector" (dict "ctx" . "tier" "backend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- if .Values.rbac.create }}
      serviceAccountName: {{ include "task-tracker.fullname" . }}-backend-sa
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "task-tracker.fullname" . }}-config
            - secretRef:
                name: {{ include "task-tracker.fullname" . }}-secret
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
