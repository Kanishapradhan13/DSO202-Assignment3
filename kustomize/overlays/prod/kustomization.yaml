apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: task-tracker-prod
namePrefix: prod-

resources:
  - ../../base

labels:
  - pairs:
      environment: prod

configMapGenerator:
  - name: dso202-config
    behavior: merge
    literals:
      - ENVIRONMENT=prod
      - DB_HOST=prod-db-headless
      - CORS_ORIGIN=http://prod.tasktracker.local

secretGenerator:
  - name: dso202-secret
    behavior: replace
    literals:
      - DB_USER=taskuser
      - DB_PASSWORD=Pr0d-Only-Pass!
      - POSTGRES_USER=taskuser
      - POSTGRES_PASSWORD=Pr0d-Only-Pass!

replicas:
  - name: backend-deployment
    count: 2
  - name: frontend-deployment
    count: 2

patches:
  - target:
      kind: Ingress
      name: task-tracker-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: prod.tasktracker.local
  - target:
      kind: ResourceQuota
      name: dso202-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: "2"
      - op: replace
        path: /spec/hard/pods
        value: "12"
  - target:
      kind: Deployment
      name: backend-deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 384Mi
