apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: task-tracker-dev
namePrefix: dev-

resources:
  - ../../base

labels:
  - pairs:
      environment: dev

configMapGenerator:
  - name: dso202-config
    behavior: merge
    literals:
      - ENVIRONMENT=dev
      - DB_HOST=dev-db-headless
      - BACKEND_URL=http://dev.tasktracker.local:8088

patches:
  - target:
      kind: Ingress
      name: task-tracker-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.tasktracker.local
