apiVersion: v1
kind: ResourceQuota
metadata:
  name: dso202-quota
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: "1.5Gi"
    limits.cpu: "3"
    limits.memory: "3Gi"
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dso202-limitrange
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      min:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "1"
        memory: "1Gi"
