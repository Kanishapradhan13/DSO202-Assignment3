apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - quota.yaml
  - rbac.yaml
  - database.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: task-tracker
      app.kubernetes.io/managed-by: kustomize

configMapGenerator:
  - name: dso202-config
    literals:
      - DB_HOST=db-headless
      - DB_PORT=5432
      - DB_NAME=tasksdb
      - APP_PORT=8080
      - CORS_ORIGIN=*
      - POSTGRES_DB=tasksdb
      - BACKEND_URL=

secretGenerator:
  - name: dso202-secret
    literals:
      - DB_USER=taskuser
      - DB_PASSWORD=ChangeMe123!
      - POSTGRES_USER=taskuser
      - POSTGRES_PASSWORD=ChangeMe123!
